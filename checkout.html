<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VELORA — Checkout</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            background: #050505;
            color: #f2eee7;
            font-family: "DM Sans", sans-serif;
        }

        .checkout-page {
            min-height: 100vh;
            padding: 130px 7vw 80px;
        }

        .checkout-header {
            margin-bottom: 70px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,.12);
        }

        .checkout-eyebrow {
            color: #c7a66a;
            font-size: 11px;
            letter-spacing: 4px;
            margin-bottom: 18px;
        }

        .checkout-title {
            font-family: "Playfair Display", serif;
            font-size: clamp(55px, 8vw, 110px);
            font-weight: 400;
            line-height: .85;
            margin: 0;
        }

        .checkout-layout {
            display: grid;
            grid-template-columns: 1.2fr .8fr;
            gap: 80px;
        }

        .checkout-section-title {
            font-family: "Playfair Display", serif;
            font-size: 32px;
            font-weight: 400;
            margin-bottom: 30px;
        }

        .checkout-form {
            display: grid;
            gap: 18px;
        }

        .checkout-form input,
        .checkout-form textarea,
        .checkout-form select {
            width: 100%;
            box-sizing: border-box;
            padding: 18px;

            background: transparent;
            border: 1px solid rgba(255,255,255,.15);

            color: #f2eee7;
            font-family: "DM Sans", sans-serif;
            outline: none;
        }

        .checkout-form textarea {
            min-height: 120px;
            resize: vertical;
        }

        .checkout-form input:focus,
        .checkout-form textarea:focus,
        .checkout-form select:focus {
            border-color: #c7a66a;
        }

        .order-summary {
            position: sticky;
            top: 120px;

            padding: 35px;

            border: 1px solid rgba(255,255,255,.12);
            background: rgba(255,255,255,.025);
        }

        .summary-title {
            font-family: "Playfair Display", serif;
            font-size: 32px;
            font-weight: 400;
            margin-bottom: 30px;
        }

        .checkout-item {
            display: flex;
            justify-content: space-between;
            gap: 20px;

            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,.08);

            font-size: 13px;
        }

        .checkout-item span:first-child {
            color: rgba(242,238,231,.6);
        }

        .checkout-total {
            display: flex;
            justify-content: space-between;

            margin-top: 25px;
            padding-top: 20px;

            border-top: 1px solid rgba(255,255,255,.2);

            font-size: 18px;
        }

        .checkout-total span:last-child {
            color: #c7a66a;
        }

        .place-order {
            width: 100%;
            margin-top: 35px;
            padding: 19px;

            border: none;
            background: #f2eee7;
            color: #050505;

            font-size: 11px;
            letter-spacing: 3px;

            cursor: pointer;
        }

        .place-order:hover {
            background: #c7a66a;
        }

        .back-cart {
            display: inline-block;
            margin-top: 25px;

            color: rgba(242,238,231,.5);
            text-decoration: none;

            font-size: 10px;
            letter-spacing: 2px;
        }

        .back-cart:hover {
            color: #c7a66a;
        }

        @media (max-width: 800px) {

            .checkout-page {
                padding: 110px 25px 60px;
            }

            .checkout-layout {
                grid-template-columns: 1fr;
                gap: 50px;
            }

            .order-summary {
                position: static;
            }

        }

    </style>

</head>

<body>

    <main class="checkout-page">

        <header class="checkout-header">

            <p class="checkout-eyebrow">
                VELORA / CHECKOUT
            </p>

            <h1 class="checkout-title">
                COMPLETE<br>
                <em>ORDER.</em>
            </h1>

        </header>


        <div class="checkout-layout">

            <!-- CUSTOMER DETAILS -->

            <section>

                <h2 class="checkout-section-title">
                    Delivery Details
                </h2>

                <form class="checkout-form" id="checkoutForm">

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Full Name"
                        required
                    >

                    <input
                        type="email"
                        id="email"
                        placeholder="Email Address"
                        required
                    >

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Phone Number"
                        required
                    >

                    <input
                        type="text"
                        id="address"
                        placeholder="Address"
                        required
                    >

                    <input
                        type="text"
                        id="city"
                        placeholder="City"
                        required
                    >

                    <input
                        type="text"
                        id="pincode"
                        placeholder="PIN Code"
                        required
                    >

                </form>

            </section>


            <!-- ORDER SUMMARY -->

            <aside class="order-summary">

                <h2 class="summary-title">
                    Your Order
                </h2>

                <div id="checkoutItems"></div>

                <div class="checkout-total">

                    <span>
                        TOTAL
                    </span>

                    <span id="checkoutTotal">
                        ₹0
                    </span>

                </div>

                <button
                    class="place-order"
                    id="placeOrder"
                    type="button"
                >
                    PLACE ORDER ↗
                </button>

                <a
                    href="cart.html"
                    class="back-cart"
                >
                    ← BACK TO BAG
                </a>

            </aside>

        </div>

    </main>


    <script>

document.addEventListener("DOMContentLoaded", () => {

    /* =========================================
       VELORA — CHECKOUT
       ========================================= */

    const storedCart = localStorage.getItem("veloraCart");

    console.log("VELORA STORED CART:", storedCart);

    const cart = storedCart
        ? JSON.parse(storedCart)
        : [];

    console.log("VELORA CHECKOUT CART:", cart);


    const checkoutItems =
        document.getElementById("checkoutItems");

    const checkoutTotal =
        document.getElementById("checkoutTotal");


    let total = 0;


    /* =========================================
       DISPLAY CART ITEMS
       ========================================= */

    checkoutItems.innerHTML = "";


    cart.forEach((item) => {

        const quantity =
            Number(item.quantity) || 1;


        const price =
            Number(
                String(item.price)
                    .replace(/[₹,]/g, "")
            ) || 0;


        const itemTotal =
            price * quantity;


        total += itemTotal;


        const itemElement =
            document.createElement("div");


        itemElement.className =
            "checkout-item";


        itemElement.innerHTML = `
            <span>
                ${item.name} × ${quantity}
            </span>

            <span>
                ₹${itemTotal.toLocaleString("en-IN")}
            </span>
        `;


        checkoutItems.appendChild(itemElement);

    });


    /* =========================================
       TOTAL
       ========================================= */

    checkoutTotal.textContent =
        `₹${total.toLocaleString("en-IN")}`;


    console.log(
        "VELORA CHECKOUT TOTAL:",
        total
    );


    /* =========================================
       PLACE ORDER
       ========================================= */

    const placeOrder =
        document.getElementById("placeOrder");


    placeOrder.addEventListener("click", () => {

        const form =
            document.getElementById("checkoutForm");


        if (!form.checkValidity()) {

            form.reportValidity();

            return;

        }


     /* SAVE ORDER DETAILS */

const orderDetails = {
    name: document.getElementById("fullName").value.trim(),
    email: document.getElementById("email").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    address: document.getElementById("address").value.trim(),
    city: document.getElementById("city").value.trim(),
    pincode: document.getElementById("pincode").value.trim(),
    total: total
};

localStorage.setItem(
    "veloraOrder",
    JSON.stringify(orderDetails)
);  

        /* GO TO SUCCESS PAGE */

       window.location.href = "payment.html";
    });

});

</script>
